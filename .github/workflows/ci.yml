name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  mysql:
    name: PHP tests (MySQL, row locking)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app

      - name: Run tests against MySQL (includes the concurrent registration test)
        run: php artisan test

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tsconfig.json maps `ziggy-js` to vendor/tightenco/ziggy, so the type check
      # needs Composer's packages even though no PHP code runs in this job.
      - uses: ./.github/actions/setup-app
        with:
          composer-args: --no-scripts
          build: 'false'

      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run types

      - name: Component tests
        run: npm test
