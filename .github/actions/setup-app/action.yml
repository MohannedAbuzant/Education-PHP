name: Set up the app
description: PHP 8.3, Node 22 and the dependencies, shared by the CI jobs.

inputs:
  composer-args:
    description: Extra flags for `composer install`.
    default: ''
  build:
    description: "'true' builds the Vite assets and prepares .env; 'false' skips both."
    default: 'true'

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      shell: bash
      run: |
        composer install --no-interaction --prefer-dist --no-progress ${{ inputs.composer-args }}
        npm ci

    - name: Build assets and prepare .env
      if: inputs.build == 'true'
      shell: bash
      run: |
        npm run build
        cp .env.example .env
        php artisan key:generate
